<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7dbe9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AION2 ♡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>AION2 ♡ Daily manager ♡</title>
<style>
:root{--pink:#e8a2c0;--pink2:#fff0f7;--purple:#8d6b91;--deep:#2b222d;--muted:#9b899b;--card:#fffafd;--line:#ead9e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(160deg,#fff7fb,#f8e9f3 55%,#eee7f3);color:var(--deep);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
button,input,select{font:inherit}button{border:0}
.app{max-width:680px;margin:auto;padding:env(safe-area-inset-top) 12px calc(28px + env(safe-area-inset-bottom))}
.hero{margin-top:10px;padding:18px 14px 16px;border-radius:28px;background:linear-gradient(135deg,#fff0f7,#eee5f3);box-shadow:0 10px 30px #6f54751a;border:1px solid #fff;position:relative;overflow:hidden}
.hero:before,.hero:after{position:absolute;content:"♥";font-size:38px;opacity:.13}.hero:before{left:8px;top:8px}.hero:after{right:8px;bottom:4px}
.charbox{display:flex;align-items:center;gap:12px}
.charbox img{width:86px;height:86px;border-radius:24px;object-fit:cover;border:3px solid #fff;box-shadow:0 5px 16px #6f547522}
h1{font-size:20px;margin:0 0 3px}.subtitle{font-size:11px;color:var(--muted)}.charname{font-weight:900;color:var(--purple);font-size:15px;margin-top:6px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.stat{background:#ffffffc9;border-radius:18px;padding:11px;text-align:center}.label{font-size:10px;color:var(--muted)}.num{font-size:25px;font-weight:900;color:var(--purple)}.remain{font-size:11px}.bar{height:7px;background:#eee2eb;border-radius:99px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e99abd,#9c79a3);border-radius:99px}
.tabs{display:flex;gap:7px;margin:13px 1px}.tab{flex:1;border-radius:14px;padding:11px 6px;background:#ffffffa8;color:#806d83;font-weight:900}.tab.active{background:var(--deep);color:#fff}
.panel{background:#fffafdc9;border:1px solid #fff;border-radius:22px;padding:13px;box-shadow:0 7px 22px #6f547512}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.title{font-weight:900}.note{font-size:10px;color:var(--muted)}
.task{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:29px;height:29px;border:2px solid #d6c7d5;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;font-weight:900}.done .check{background:var(--purple);border-color:var(--purple);color:#fff}.info{flex:1;min-width:0}.name{font-size:13px;font-weight:800}.done .name{color:#aaa;text-decoration:line-through}.complete{font-size:10px;color:#9a6f8d;font-weight:900}.del{padding:7px 8px;border-radius:9px;background:#f6e8ee;color:#8e6a79;font-size:10px}
.form{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:11px}.form input{min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;outline:none}.add,.save{background:var(--purple);color:#fff;border-radius:12px;padding:0 13px;font-weight:900}
.charlist{display:flex;gap:6px;overflow:auto;padding:3px 0 8px}.chip{white-space:nowrap;padding:8px 11px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:800;color:#806d83}.chip.sel{background:var(--deep);color:#fff}
.setting{margin-top:12px}.setting label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}.setting input,.setting select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.install{margin-top:12px;background:#fff1f7;border:1px dashed #d7a5be;border-radius:15px;padding:11px;font-size:11px;color:#7e687d;line-height:1.6}
.footer{text-align:center;color:#ad99ac;font-size:10px;padding:13px}
@media(max-width:420px){.charbox img{width:76px;height:76px}h1{font-size:18px}.num{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
 <div class="charbox"><img src="7C7A1664-1C13-45DA-8BBC-27F8E6DCBA72.png" alt="小悪魔キャラクター">
  <div><h1>AION2 ♡ Daily manager ♡</h1><div class="subtitle"> (⃔ *`꒳´ * )⃕↝⋆｡°✩</div><div class="charname" id="charName">ゆにゃりりむ</div></div>
 </div>
 <div class="summary">
  <div class="stat"><div class="label">TODAY · 日課</div><div class="num" id="dn">0 / 0</div><div class="remain" id="dr">タスクを追加してね</div><div class="bar"><i id="db"></i></div></div>
  <div class="stat"><div class="label">THIS WEEK · 週課</div><div class="num" id="wn">0 / 0</div><div class="remain" id="wr">タスクを追加してね</div><div class="bar"><i id="wb"></i></div></div>
 </div>
</section>

<div class="tabs"><button class="tab active" data-tab="daily">♡ 日課 ♡</button><button class="tab" data-tab="weekly">♆ 週課 ♆</button><button class="tab" data-tab="settings">⚙ 設定</button></div>

<section class="panel" id="daily"><div class="head"><div><div class="title">♡ 今日やること</div><div class="note" id="dreset"></div></div><button class="del" id="rd">リセット</button></div><div id="dl"></div><div class="form"><input id="di" placeholder="日課を追加…"><button class="add" id="ad">追加</button></div></section>

<section class="panel" id="weekly" hidden><div class="head"><div><div class="title">♆ 今週やること</div><div class="note" id="wreset"></div></div><button class="del" id="rw">リセット</button></div><div id="wl"></div><div class="form"><input id="wi" placeholder="週課を追加…"><button class="add" id="aw">追加</button></div></section>

<section class="panel" id="settings" hidden>
 <div class="title">⚙ キャラ設定</div>
 <div class="setting"><label>キャラクター</label><div class="charlist" id="chars"></div><div class="form"><input id="ci" placeholder="キャラクター名を追加…"><button class="add" id="ac">追加</button></div></div>
 <div class="setting grid"><div><label>日課リセット時刻</label><input id="hour" type="number" min="0" max="23"></div><div><label>週課リセット曜日</label><select id="day"><option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="6">土曜日</option><option value="0">日曜日</option></select></div></div>
 <button class="save" id="save" style="margin-top:10px">設定を保存</button>
 <div class="install"><b>📱 ホーム画面に置く方法</b><br>Safariでこのアプリを公開URLから開く → 共有ボタン → 「ホーム画面に追加」 → 追加。<br>※ホーム画面追加にはHTTPSで公開されたURLが必要だよ。</div>
</section>
<div class="footer">♡ ♡</div>
</div>
<script>
const K="aion2_lilith_pwa_v2",uid=()=>Math.random().toString(36).slice(2)+Date.now();
const DD=[["デイリーダンジョン","強化石✿ペット✿キーナ"],["シューゴ祭","毎時00分"],["亀裂","毎時30分"],["ナイトメア","毎日2回"]];
const WW=[["アセンショントライアル","今週分"],["週間ダンジョン","週制限"],["週課報酬","受け取り忘れチェック"]];
let d=JSON.parse(localStorage.getItem(K)||"null");
if(!d){d={s:{hour:4,day:1},chars:{},cur:"ゆにゃりりむ"};d.chars[d.cur]={daily:DD.map(x=>({id:uid(),name:x[0],note:x[1],done:false})),weekly:WW.map(x=>({id:uid(),name:x[0],done:false})),ds:null,ws:null}}
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(d)),c=()=>d.chars[d.cur];
function reset(){let now=new Date(),e=new Date(now);if(now.getHours()<d.s.hour)e.setDate(e.getDate()-1);let ds=e.toISOString().slice(0,10);if(c().ds!==ds){c().daily.forEach(t=>t.done=false);c().ds=ds}
let diff=(e.getDay()-d.s.day+7)%7,w=new Date(e);w.setDate(w.getDate()-diff);let ws=w.toISOString().slice(0,10);if(c().ws!==ws){c().weekly.forEach(t=>t.done=false);c().ws=ws}save()}
function list(type){let el=$(type==="daily"?"dl":"wl"),a=c()[type];el.innerHTML="";if(!a.length){el.innerHTML='<div style="text-align:center;padding:24px;color:#9b899b;font-size:12px">まだタスクがないよ♡</div>';return}
a.forEach(t=>{let r=document.createElement("div");r.className="task"+(t.done?" done":"");r.innerHTML=`<div class="check">${t.done?"♡":""}</div><div class="info"><div class="name"></div><div class="note"></div></div>${t.done?'<div class="complete">♡ 完了 ♡</div>':""}<button class="del">削除</button>`;r.querySelector(".name").textContent=t.name;r.querySelector(".note").textContent=t.note||"";r.querySelector(".check").onclick=()=>{t.done=!t.done;save();render()};r.querySelector(".del").onclick=()=>{if(confirm("削除する？")){c()[type]=c()[type].filter(x=>x.id!==t.id);save();render()}};el.appendChild(r)})}
function sum(type){let a=c()[type],done=a.filter(x=>x.done).length,total=a.length,rem=total-done,p=type==="daily"?["dn","dr","db"]:["wn","wr","wb"];$(p[0]).textContent=`${done} / ${total}`;$(p[1]).textContent=total?(rem?`あと${rem}個！`:"♡ 全部完了 ♡"):"タスクを追加してね";$(p[2]).style.width=(total?done/total*100:0)+"%"}
function chars(){let e=$("chars");e.innerHTML="";Object.keys(d.chars).forEach(n=>{let b=document.createElement("button");b.className="chip"+(n===d.cur?" sel":"");b.textContent=n;b.onclick=()=>{d.cur=n;save();render()};e.appendChild(b)})}
function render(){reset();$("charName").textContent=d.cur;sum("daily");sum("weekly");list("daily");list("weekly");chars();$("hour").value=d.s.hour;$("day").value=d.s.day;$("dreset").textContent=`毎日 ${String(d.s.hour).padStart(2,"0")}:00 にリセット`;$("wreset").textContent=`毎週 ${["日","月","火","水","木","金","土"][d.s.day]}曜日にリセット`}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");["daily","weekly","settings"].forEach(x=>$(x).hidden=x!==b.dataset.tab)});
$("ad").onclick=()=>{let n=$("di").value.trim();if(!n)return;c().daily.push({id:uid(),name:n,note:"",done:false});$("di").value="";save();render()};
$("aw").onclick=()=>{let n=$("wi").value.trim();if(!n)return;c().weekly.push({id:uid(),name:n,note:"",done:false});$("wi").value="";save();render()};
$("ac").onclick=()=>{let n=$("ci").value.trim();if(!n||d.chars[n])return;d.chars[n]={daily:[],weekly:[],ds:null,ws:null};d.cur=n;$("ci").value="";save();render()};
$("rd").onclick=()=>{c().daily.forEach(t=>t.done=false);save();render()};$("rw").onclick=()=>{c().weekly.forEach(t=>t.done=false);save();render()};
$("save").onclick=()=>{d.s.hour=Math.max(0,Math.min(23,Number($("hour").value)||0));d.s.day=Number($("day").value);c().ds=null;c().ws=null;save();render();alert("保存したよ♡")};
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
